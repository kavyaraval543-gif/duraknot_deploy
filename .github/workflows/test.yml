name: Tests

on:
  push:
  pull_request:

jobs:
  oee-unit-tests:
    name: OEE unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/test_oee.py -v

  render-verification:
    name: Headless render verification (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: node render_check.js
        working-directory: tests
